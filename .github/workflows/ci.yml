name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Установити .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Відновити залежності
        run: dotnet restore LibraryDesk.sln

      - name: Перевірити форматування
        run: dotnet format LibraryDesk.sln --verify-no-changes --no-restore

      - name: Скласти Release з аналізаторами
        run: dotnet build LibraryDesk.sln -c Release --no-restore

      - name: Виконати тести зі збиранням покриття
        run: |
          dotnet test tests/Legacy.Tests/LibraryDesk.Legacy.Tests.csproj -c Release --no-build --no-restore
          dotnet test LibraryDesk.Tests/LibraryDesk.Tests.csproj -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --settings docs/sr03/coverlet.runsettings \
            --results-directory artifacts/sr03-coverage

      - name: Перевірити поріг покриття 70 відсотків
        run: python3 tools/check_coverage.py artifacts/sr03-coverage 70

      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: warn
